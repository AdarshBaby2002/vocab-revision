<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Practice - Vocab Revision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page-loader" class="page-loader" role="status" aria-live="polite">
        <div class="loader-card">
            <div class="loader-spinner" aria-hidden="true"></div>
            <strong>Loading Writing Practice</strong>
            <span>Preparing your writing tasks...</span>
        </div>
    </div>
    <div class="container">
        <header class="app-header">
            <div class="header-top">
                <div class="logo">
                    <h1>Writing Practice</h1>
                </div>
                <div id="auth-card" class="auth-compact">
                    <div id="auth-form" class="auth-actions">
                        <a href="signin.html" class="btn-secondary btn-small" style="text-decoration: none;">Sign In</a>
                        <a href="signup.html" class="btn-primary btn-small" style="text-decoration: none;">Sign Up</a>
                    </div>
                    <div class="auth-topline" style="margin-bottom: 0;">
                        <strong id="user-badge" class="user-badge">Not signed in</strong>
                        <button type="button" id="sign-out-btn" class="btn-secondary btn-small" style="display: none;">Sign Out</button>
                    </div>
                    <div id="auth-status" style="display: none;"></div>
                </div>
            </div>

            <div class="hero-section">
                <p>Use saved vocabulary in level-wise German writing tasks.</p>
                <div class="hero-actions" style="margin-bottom: 1.5rem;">
                    <a href="index.html" class="btn-secondary" style="text-decoration: none;">Home</a>
                    <a href="quiz.html" class="btn-secondary" style="text-decoration: none;">Quiz</a>
                    <a href="admin.html" id="admin-link" class="btn-secondary" style="display: none; text-decoration: none;">Admin</a>
                </div>

                <div class="quiz-controls">
                    <div class="quiz-control">
                        <label for="writing-level">Level</label>
                        <select id="writing-level">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                        </select>
                    </div>
                    <button type="button" id="new-writing-prompt-btn" class="btn-secondary">New Prompt</button>
                </div>
            </div>
        </header>

        <div class="glass-card" id="writing-card">
            <div id="writing-load-status" class="list-status">Loading vocabulary...</div>

            <form id="writing-form" style="display: none;">
                <div class="writing-prompt">
                    <span id="writing-level-badge" class="level-badge">A1</span>
                    <h2 id="writing-target-word">Word</h2>
                    <p id="writing-translation"></p>
                    <p id="writing-prompt-text"></p>
                </div>

                <div class="input-group">
                    <label for="writing-answer">Your German Writing</label>
                    <textarea id="writing-answer" rows="7" placeholder="Write your German sentence or paragraph here..." required></textarea>
                </div>

                <div class="writing-actions">
                    <button type="button" id="clear-writing-btn" class="btn-secondary">Clear</button>
                    <button type="submit" id="check-writing-btn" class="btn-primary">
                        <span class="btn-text">Check Writing</span>
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                </div>
            </form>

            <div id="writing-result" class="writing-result" style="display: none;"></div>
        </div>

        <section class="glass-card" id="writing-stats-card" style="display: none;">
            <div class="panel-heading">
                <h2>Your Writing Progress</h2>
            </div>
            <div id="writing-stats-content"></div>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="auth.js"></script>
    <script src="writing.js"></script>
</body>
</html>
